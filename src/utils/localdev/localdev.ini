# ============================================================================
# NOTES
# ============================================================================
#
# Typical flow for a ticket:
#   1. Set branch_or_tag in the component's section to your branch name
#   2. ./localdev.py --update --component <name>   fetch, create/switch branch
#   3. build:  cd <hostpath> && ./gradlew bootJar   (Java 21)
#   4. ./localdev.py --setup --component <name>    patch the live Deployment
#   5. test, commit locally; you push and raise the PR from your fork
#   6. ./localdev.py --restore --component <name>
#
# Commands:
#   ./localdev.py --status                        show all component states
#                                                 (↓N = commits behind upstream/<base_branch>)
#   ./localdev.py --setup --component <name>      checkout + patch
#   ./localdev.py --checkout                      clone missing repos only
#   ./localdev.py --update                        fetch, switch to branch_or_tag, fast-forward
#   ./localdev.py --restore --component <name>    restore original Deployment from backup
#
# localdev never pushes, merges or rebases: --update only fast-forwards, and
# refuses to switch branches over uncommitted changes.
#
# ============================================================================
