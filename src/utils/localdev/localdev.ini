# localdev.ini - Local Development Configuration
# Location: mifos-gazelle/src/utils/localdev/localdev.ini
#
# Configures PHEE components for local development with hostPath volumes.
# All components are operator-managed (PaymentHubDeployment CRs); localdev.py
# patches the live Kubernetes Deployment directly via kubectl (k8s-direct-mode).
#
# Variable expansion is supported:
#   - Environment variables: $HOME, $USER, etc.
#   - Custom variables: ${gazelle-home} references [general] section

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
[general]
# Root directory of your mifos-gazelle repository
# You can use $HOME or other environment variables
gazelle-home = $HOME/mifos-gazelle

# --- Forks ------------------------------------------------------------------
# openMF branch protection blocks new branches, so work happens in personal
# forks. Create/sync them first with:  src/utils/localdev/fork-phee-repos.sh
#
# fork_owner: GitHub user or org holding your forks of the openMF repos.
#   auto  = your `gh` login (default)     none = clone from upstream directly
#   The LOCALDEV_FORK_OWNER environment variable overrides this.
# Remotes in each clone:  origin   = <fork_owner>/<repo>  (git_protocol)
#                         upstream = <upstream_owner>/<repo>  (https, push DISABLED)
fork_owner = auto
upstream_owner = openMF
git_protocol = ssh

# Defaults for every section (each can be overridden per section)
checkout_to_dir = ${HOME}
# Upstream branch new work branches are cut from
base_branch = dev


# ============================================================================
# COMPONENT CONFIGURATIONS
# ============================================================================
# Repository fields:
#   checkout_enabled = true/false  include the repo in --checkout / --update
#   repo             = paymenthub-ee-<name>  repo name; URLs come from [general]
#   reponame         = full git URL instead of repo, for repos that aren't forked
#   branch_or_tag    = branch to work on (default: base_branch). Put YOUR branch
#                      name here; if it exists neither locally nor on your fork,
#                      --update creates it from upstream/<base_branch> (local
#                      only — localdev never pushes). Can also be a tag.
#   module           = subdirectory of a multi-module repo holding the service
#
# Patch fields (k8s_deploy_name present → patchable):
#   k8s_deploy_name  = Deployment name   (kubectl get deploy -n paymenthub)
#   k8s_namespace    = paymenthub
#   app_type         = springboot | webapp
#   image            = runtime image for springboot (JDK/JRE)
#   hostpath         = default <checkout_to_dir>/<repo>[/<module>]
#                      springboot: mounted at /app; webapp: at /usr/share/nginx/html
#   jarpath          = default: auto-detected boot jar in <hostpath>/build/libs
#                      (*-plain.jar ignored). Set only to force a specific jar.
#
# Sections sharing one repo (data-pipeline, e2e-tests) must use the same
# branch_or_tag — it's one working tree.

# ----------------------------------------------------------------------------
# PaymentHub operator
# Its Deployment is applied directly by paymenthub.sh (not from a
# PaymentHubDeployment CR), so nothing reconciles/reverts a patch to it.
# Build: cd ~/paymenthub-ee-k8s-operators/paymenthub-operator && ./gradlew bootJar
# ----------------------------------------------------------------------------
[paymenthub-operator]
k8s_deploy_name = paymenthub-ee-operator
k8s_namespace = paymenthub
app_type = springboot
image = eclipse-temurin:21
checkout_enabled = true
repo = paymenthub-ee-k8s-operators
module = paymenthub-operator
branch_or_tag = dev

